[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honeytrace"
version = "2.0.0"
description = "HoneyTrace - Linux intrusion deception, detection and evidence framework"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "HoneyTrace Team" }]
keywords = ["honeypot", "forensics", "deception", "intrusion", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "psutil>=5.9",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
decoys = ["openpyxl>=3.1", "python-docx>=1.1", "reportlab>=4.0"]
gui = ["pystray>=0.19", "Pillow>=10.0"]
capture = ["watchdog>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
honeytrace = "honeytrace.cli:main"

[project.urls]
Homepage = "https://github.com/Darth-sader/HoneyTrace"
Repository = "https://github.com/Darth-sader/HoneyTrace.git"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
honeytrace = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running performance tests (deselect with '-m \"not slow\"')",
    "linux_only: tests that require Linux-specific facilities",
]
